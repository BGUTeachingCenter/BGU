<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
<script async src="/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחולל כרטיסיות זיכרון מעוצב</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #ff8fab; /* ורוד פסטל */
            --secondary-color: #8ac6d1; /* תכלת רך */
            --bg-color: #fff0f3;
            --text-color: #555;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #fff0f3 0%, #e0f7fa 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .box { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            max-width: 600px; 
            width: 90%; 
            border: 2px solid white;
        }
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 400px; 
            max-height: 300px;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }
        h1 { color: #333; margin-bottom: 5px; font-weight: 700; }
        p { color: #777; margin-bottom: 30px; font-size: 1rem; }
        
        .step { 
            margin-bottom: 25px; 
            padding: 20px; 
            border-radius: 15px; 
            background-color: #f8f9fa; 
            border: 1px solid #eee; 
            transition: transform 0.2s;
        }
        .step:hover { transform: translateY(-2px); border-color: var(--secondary-color); }
        .step-title { font-weight: bold; margin-bottom: 15px; display: block; color: #444; font-size: 1.1rem; }
        
        .custom-file-upload {
            display: inline-block;
            padding: 12px 30px;
            cursor: pointer;
            background-color: var(--secondary-color);
            color: white;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(138, 198, 209, 0.4);
        }
        .custom-file-upload:hover { background-color: #72b2bd; transform: scale(1.05); }
        input[type="file"] { display: none; }

        .encoding-selector {
            margin-top: 20px;
            text-align: center;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed #ccc;
        }
        .encoding-selector label { font-size: 0.9rem; font-weight: bold; color: #555; }
        .encoding-selector select {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #999;
            font-family: inherit;
            margin-top: 5px;
            width: 100%;
            max-width: 250px;
        }

        /* עיצוב כפתורים */
        .btn {
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 1.1rem;
            padding: 12px 30px;
            margin: 5px;
        }

        #downloadBtn {
            display: none;
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 143, 171, 0.4);
            width: 80%;
            margin: 0 auto;
        }
        #downloadBtn:hover { background-color: #ff7597; transform: scale(1.05); }

        /* כפתור לדוגמה */
        .example-btn {
            background-color: transparent;
            border: 2px solid #bbb;
            color: #666;
            font-size: 0.9rem;
            padding: 8px 20px;
            margin-top: 15px;
        }
        .example-btn:hover { background-color: #eee; color: #333; }

        #status { margin-top: 15px; font-weight: 600; min-height: 25px; font-size: 0.95rem; white-space: pre-wrap; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container">
        <img src="logo.jpg" alt="לוגו היחידה" onerror="this.style.display='none'">
    </div>

    <h1>מחולל כרטיסיות</h1>
    <p>
        העלו קובץ אקסל והמערכת תיצור משחק למידה מעוצב.<br>
        <strong>טור A - צד השאלות | טור B - צד התשובות</strong><br>
        <span style="font-size: 0.9em; color: #888;">(נוסחאות מתמטיות יש לכתוב ב-LaTeX)</span>
    </p>
    
    <div class="step">
        <span class="step-title">שלב 1: טעינת שאלות</span>
        <label for="fileInput" class="custom-file-upload">
            📂 בחרו קובץ Excel / CSV
        </label>
        <input type="file" id="fileInput" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" />
        
        <div class="encoding-selector">
            <label for="encodingSelect">הטקסט יצא ג'יבריש? נסו לשנות כאן:</label><br>
            <select id="encodingSelect">
                <option value="UTF-8">UTF-8 (רוב הקבצים החדשים)</option>
                <option value="windows-1255">Windows-1255 (אקסל בעברית ישן)</option>
                <option value="ISO-8859-8">ISO-8859-8 (עברית ויזואלית)</option>
            </select>
        </div>

        <div id="status">ממתין לקובץ...</div>

        <button class="btn example-btn" onclick="loadExample()">אין לכם קובץ? 🧪 הורידו משחק לדוגמה (20 חומצות אמינו)</button>
    </div>

    <div class="step">
        <span class="step-title">שלב 2: יצירת המשחק</span>
        <button id="downloadBtn" class="btn" onclick="downloadGame()">⬇️ הורידו את המשחק המוכן</button>
    </div>
    <p>
        את הקובץ ניתן לשלוח ישירות לסטודנטים<br>
        או להעלות למודל על ידי העלאת משאב מסוג "קובץ".
    </p>
</div>

<script>
    let processedCards = null;
    let isExample = false;

    // מאגר 20 חומצות האמינו
    const exampleData = [
        { question: "A", answer: "Alanine (אלנין)<br>C₃H₇NO₂" },
        { question: "R", answer: "Arginine (ארגינין)<br>C₆H₁₄N₄O₂<br>בסיסית, מטען חיובי" },
        { question: "N", answer: "Asparagine (אספרגין)<br>C₄H₈N₂O₃" },
        { question: "D", answer: "Aspartic Acid (חומצה אספרטית)<br>C₄H₇NO₄<br>חומצית, מטען שלילי" },
        { question: "C", answer: "Cysteine (ציסטאין)<br>מכילה גופרית, יוצרת קשרי S-S" },
        { question: "E", answer: "Glutamic Acid (חומצה גלוטמית)<br>C₅H₉NO₄<br>חומצית, מטען שלילי" },
        { question: "Q", answer: "Glutamine (גלוטמין)<br>C₅H₁₀N₂O₃" },
        { question: "G", answer: "Glycine (גליצין)<br>החומצה הקטנה ביותר ($H$ בשייר)" }, 
        { question: "H", answer: "Histidine (היסטידין)<br>בסיסית, חיונית לתינוקות" },
        { question: "I", answer: "Isoleucine (איזולאוצין)<br>הידרופובית, איזומר של לאוצין" },
        { question: "L", answer: "Leucine (לאוצין)<br>הידרופובית, שייר מסועף" },
        { question: "K", answer: "Lysine (ליזין)<br>בסיסית, מטען חיובי" },
        { question: "M", answer: "Methionine (מתיונין)<br>מכילה גופרית ($S$), קודון התחלה" },
        { question: "F", answer: "Phenylalanine (פנילאלנין)<br>ארומטית (טבעת בנזן)" },
        { question: "P", answer: "Proline (פרולין)<br>מבנה טבעתי מיוחד (Imine)" },
        { question: "S", answer: "Serine (סרין)<br>מכילה קבוצת הידרוקסיל ($OH$)" },
        { question: "T", answer: "Threonine (תראונין)<br>מכילה קבוצת הידרוקסיל ($OH$)" },
        { question: "W", answer: "Tryptophan (טריפטופן)<br>הגדולה ביותר, ארומטית" },
        { question: "Y", answer: "Tyrosine (טירוזין)<br>ארומטית, מכילה $OH$" },
        { question: "V", answer: "Valine (ואלין)<br>הידרופובית, שייר מסועף" }
    ];

    document.getElementById('fileInput').addEventListener('change', handleFile, false);
    
    document.getElementById('encodingSelect').addEventListener('change', () => {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length > 0) {
            handleFile({ target: fileInput });
        }
    });

    // פונקציה לטעינת הדוגמה
    function loadExample() {
        processedCards = exampleData;
        isExample = true;
        const statusDiv = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        
        // איפוס קובץ אם נבחר קודם
        document.getElementById('fileInput').value = ""; 

        statusDiv.innerText = "✅ נטענו נתוני דוגמה: 20 חומצות האמינו.";
        statusDiv.className = "success";
        downloadBtn.style.display = "block";
        
        // גלילה לכפתור ההורדה
        downloadBtn.scrollIntoView({behavior: "smooth"});
    }

    function handleFile(e) {
        const file = e.target.files[0];
        const statusDiv = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const encodingType = document.getElementById('encodingSelect').value;
        
        downloadBtn.style.display = "none";
        statusDiv.className = "";
        processedCards = null;
        isExample = false;

        if (!file) return;

        statusDiv.innerText = "קורא קובץ...";
        
        const reader = new FileReader();
        
        reader.onload = function(e) {
            try {
                const data = e.target.result;
                const workbook = XLSX.read(data, {type: 'string'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                
                const validData = [];
                
                for(let i=0; i<jsonData.length; i++) {
                    const row = jsonData[i];
                    if(row.length >= 2 && row[0] != null && row[1] != null) {
                        let q = row[0].toString().trim();
                        let a = row[1].toString().trim();
                        
                        if (i === 0 && (q === "שאלה" || q.toLowerCase() === "question")) continue;
                        if (q === "" || a === "") continue;

                        validData.push({ question: q, answer: a });
                    }
                }

                if (validData.length === 0) {
                    throw new Error("לא נמצאו נתונים. בדקי שהקובץ מכיל עמודות שאלה ותשובה.");
                }

                processedCards = validData;
                statusDiv.innerText = `✅ נטענו ${validData.length} כרטיסיות!\n\nהנה דוגמה לכרטיסייה הראשונה:\n"${validData[0].question}"`;
                statusDiv.className = "success";
                downloadBtn.style.display = "block";

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "❌ שגיאה: " + err.message + "\n(נסו לשנות את סוג הקידוד בתפריט למעלה)";
                statusDiv.className = "error";
            }
        };

        reader.readAsText(file, encodingType);
    }

    function downloadGame() {
        if (!processedCards) return;
        
        // בחירת שם לקובץ בהתאם לתוכן (דוגמה או קובץ משתמש)
        const filename = isExample ? "amino_acids_game.html" : "flashcards_game.html";

        const htmlContent = `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כרטיסיות תרגול</title>
    <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\\\(', '\\\\)']], displayMath: [['$$', '$$'], ['\\\\[', '\\\\]']] }
    };
    <\/script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        
        .game-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            max-width: 300px;
            max-height: 240px;
            opacity: 0.9;
            z-index: 10;
        }

        .container { perspective: 1000px; width: 90%; max-width: 600px; height: 400px; position: relative; }
        .card { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); }
        .card.flipped { transform: rotateX(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; box-sizing: border-box; text-align: center; border-radius: 20px; font-size: 1.6rem; color: #333; overflow-y: auto; background-color: white; border: 1px solid rgba(0,0,0,0.05); white-space: pre-wrap; }
        .front { background: linear-gradient(135deg, #ffffff 0%, #f0f8ff 100%); }
        .back { background: linear-gradient(135deg, #fff9f9 0%, #fff0f0 100%); transform: rotateX(180deg); }
        
        .controls { margin-top: 30px; display: flex; gap: 20px; }
        button { padding: 12px 28px; font-size: 1rem; border: none; border-radius: 50px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-weight: 600; font-family: inherit; }
        #nextBtn { background-color: #8ac6d1; color: white; }
        #nextBtn:hover { background-color: #72b2bd; transform: translateY(-2px); }
        #resetBtn { background-color: #ff8fab; color: white; }
        #resetBtn:hover { background-color: #ff7597; transform: translateY(-2px); }
        
        .progress { margin-top: 20px; color: #888; font-size: 0.9rem; font-weight: 500; }
        .hint { margin-top: 10px; font-size: 0.8rem; color: #aaa; }
        mjx-container { font-size: 110% !important; }
    </style>
</head>
<body>
    <img src="logo.jpg" class="game-logo" onerror="this.style.display='none'" alt="לוגו">

    <div class="container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="face front"><div id="questionText">טוען...</div></div>
            <div class="face back"><div id="answerText">טוען...</div></div>
        </div>
    </div>
    <div class="progress" id="progressText"></div>
    <div class="controls">
        <button id="resetBtn" onclick="resetGame(event)">איפוס</button>
        <button id="nextBtn" onclick="nextCard(event)">הבא (Enter)</button>
    </div>
    <div class="hint">רווח להפוך, Enter למעבר</div>
    <script>
        const cardsData = ${JSON.stringify(processedCards)};
        let deck = [];
        let currentCardIndex = -1;
        
        function initGame() { 
            deck = Array.from(Array(cardsData.length).keys()); 
            shuffleDeck(); 
            nextCard(); 
        }
        
        function shuffleDeck() { 
            for (let i = deck.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [deck[i], deck[j]] = [deck[j], deck[i]]; 
            } 
        }
        
        function updateProgress() { 
            const remaining = deck.length; 
            const total = cardsData.length; 
            document.getElementById('progressText').innerText = \`כרטיסייה \${total - remaining} מתוך \${total}\`; 
        }
        
        function nextCard(event) { 
            if (event) event.stopPropagation(); 
            if (deck.length === 0) { 
                alert("כל הכבוד! סיימת את כל הכרטיסיות."); 
                initGame(); 
                return; 
            } 
            const cardElement = document.getElementById('card'); 
            cardElement.classList.remove('flipped'); 
            
            currentCardIndex = deck.pop(); 
            
            setTimeout(() => { 
                document.getElementById('questionText').innerHTML = cardsData[currentCardIndex].question; 
                document.getElementById('answerText').innerHTML = cardsData[currentCardIndex].answer; 
                if (window.MathJax) { 
                    MathJax.typesetPromise([document.getElementById('card')]).catch((err) => console.log(err)); 
                } 
                updateProgress(); 
            }, 200); 
        }
        
        function flipCard() { 
            document.getElementById('card').classList.toggle('flipped'); 
        }
        
        function resetGame(event) { 
            if (event) event.stopPropagation(); 
            if (confirm("להתחיל מחדש?")) initGame(); 
        }
        
        document.addEventListener('keydown', function(event) { 
            if (event.code === 'Space') { event.preventDefault(); flipCard(); } 
            else if (event.code === 'Enter') { event.preventDefault(); nextCard(); } 
        });
        
        window.onload = initGame;
    <\/script>
</body>
</html>`;

        const blob = new Blob([htmlContent], {type: "text/html;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
