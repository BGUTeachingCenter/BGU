# Cache policy for CloudFront (it honors origin Cache-Control).
# No invalidation available (org SCP blocks cross-account role), so TTLs
# are kept short: HTML 60s, other assets 300s. NOTE: this site has no
# content-hashed filenames (logo.png etc. change in place) - do NOT use
# long/immutable TTLs here unless a hashing build step is added first.
map $sent_http_content_type $cache_control {
    default            "public, max-age=300";
    ~text/html         "public, max-age=60";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control $cache_control;

    location / {
        try_files $uri $uri/ =404;
    }
}
